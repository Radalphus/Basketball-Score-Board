<html>
    <head>
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h1>HOME</h1>
                <h2 id="home-team-score">0</h2>
                <div class="score-buttons">
                    <button id="home-btn-1pt" onclick="addScore('home', 1)">+1</button>
                    <button id="home-btn-2pt" onclick="addScore('home', 2)">+2</button>
                    <button id="home-btn-3pt" onclick="addScore('home', 3)">+3</button>
                </div>
            </div>
            <div>
                <h1>GUEST</h1>
                <h2 id="guest-team-score">0</h2>
                <div class="score-buttons">
                    <button id="guest-btn-1pt" onclick="addScore('guest', 1)">+1</button>
                    <button id="guest-btn-2pt" onclick="addScore('guest', 2)">+2</button>
                    <button id="guest-btn-3pt" onclick="addScore('guest', 3)">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
